<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>megarohas_multichat — overlay</title>
<link rel="stylesheet" href="/overlay.css">
</head>
<body>
<div id="chat"></div>
<script>
'use strict';
const q = new URLSearchParams(location.search);
const LIMIT = Math.max(5, +q.get('limit') || 60);   // страховочный потолок по количеству в DOM
const FADE = Math.max(0, +q.get('fade') || 0);      // секунды до исчезновения, 0 = не исчезать
const SHOW_TS = q.get('ts') === '1';
const DIR_TOP = (q.get('dir') || '').toLowerCase() === 'top'; // ?dir=top — чат растёт сверху вниз
const SHOW_PLATFORM = q.get('platform') !== '0'; // ?platform=0 — скрыть значки платформ
const SHOW_BADGES = q.get('badges') !== '0';     // ?badges=0 — скрыть значки ролей

// ?size=22 — размер шрифта в px; ?font=Имя — шрифт (системный или файл из папки fonts:
// все файлы *.ttf/otf/woff/woff2 оттуда регистрируются как @font-face,
// имя семейства = имя файла без расширения)
const rootStyle = document.documentElement.style;
if (+q.get('size') > 0) rootStyle.setProperty('--size', (+q.get('size')) + 'px');
const FONT = (q.get('font') || '').trim();
if (FONT) rootStyle.setProperty('--font', JSON.stringify(FONT.replace(/["\\]/g, '')) + ', "Segoe UI", system-ui, sans-serif');
fetch('/api/fonts').then(r => r.json()).then(files => {
  const css = files.map(f =>
    `@font-face{font-family:${JSON.stringify(f.replace(/\.[^.]+$/, ''))};src:url(${JSON.stringify('/fonts/' + encodeURIComponent(f))});font-display:swap;}`
  ).join('\n');
  if (css) {
    const st = document.createElement('style');
    st.textContent = css;
    document.head.appendChild(st);
  }
}).catch(() => {});

if (DIR_TOP) document.body.classList.add('dir-top');

const chat = document.getElementById('chat');
const byId = new Map();
const cs = getComputedStyle(document.documentElement);
const ANIM_MS = parseFloat(cs.getPropertyValue('--anim')) || 320;
const GAP = parseFloat(cs.getPropertyValue('--line-gap')) || 6;
const DISSOLVE = parseFloat(cs.getPropertyValue('--dissolve')) || 22;

// Маска-«туман» нарисована на области больше плашки на --dissolve и ездит
// через mask-position. Направления градиентов в CSS подобраны так, что
// у обеих фаз один и тот же путь FROM→TO: при появлении туман стартует
// на «дышащем» крае и рассасывается за него, при исчезновении — стартует
// за краем и наползает. Никакого резкого пропадания маски по завершении.
const MASK_FROM = DIR_TOP ? '0px 0px' : `0px -${DISSOLVE}px`;
const MASK_TO = DIR_TOP ? `0px -${DISSOLVE}px` : '0px 0px';

const P_ICONS = {
  twitch: '<svg class="platform" viewBox="0 0 24 24" fill="#a970ff" xmlns="http://www.w3.org/2000/svg"><path d="M2.149 0 .537 4.119v16.836h5.731V24h3.224l3.045-3.045h4.657l6.269-6.269V0H2.149zm19.164 13.612-3.582 3.582h-5.731l-3.045 3.045v-3.045H4.283V2.149h17.03v11.463zM17.687 6.269h-2.149v6.269h2.149V6.269zm-5.731 0h-2.149v6.269h2.149V6.269z"/></svg>',
  youtube: '<svg class="platform" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="5" width="20" height="14" rx="4" fill="#ff3d3d"/><path d="M10 9.2v5.6l5-2.8z" fill="#fff"/></svg>',
};

const R_ICONS = {
  owner: '<svg class="badge" viewBox="0 0 24 24" fill="#ffd166" xmlns="http://www.w3.org/2000/svg"><path d="M12 4 8.6 9.2 3 6.4 5 18h14l2-11.6-5.6 2.8zM5.7 21h12.6v-1.6H5.7z"/></svg>',
  mod: '<svg class="badge" viewBox="0 0 24 24" fill="#57aeff" xmlns="http://www.w3.org/2000/svg"><path d="M12 2 4 5v6.1C4 16 7.4 20.4 12 22c4.6-1.6 8-6 8-10.9V5z"/></svg>',
  vip: '<svg class="badge" viewBox="0 0 24 24" fill="#f06fc0" xmlns="http://www.w3.org/2000/svg"><path d="M12 3 4 9.2 12 21l8-11.8z"/></svg>',
  sub: '<svg class="badge" viewBox="0 0 24 24" fill="#b072ff" xmlns="http://www.w3.org/2000/svg"><path d="m12 2 2.9 6.2 6.6.9-4.9 4.6 1.3 6.6L12 17l-5.9 3.3 1.3-6.6L2.5 9.1l6.6-.9z"/></svg>',
  verified: '<svg class="badge" viewBox="0 0 24 24" fill="#9aa0a6" xmlns="http://www.w3.org/2000/svg"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.6-4.2-4.2 1.7-1.7 2.5 2.5 5.9-5.9 1.7 1.7z"/></svg>',
  staff: '<svg class="badge" viewBox="0 0 24 24" fill="#9aa0a6" xmlns="http://www.w3.org/2000/svg"><path d="M12 2 4 5v6.1C4 16 7.4 20.4 12 22c4.6-1.6 8-6 8-10.9V5z"/></svg>',
  member: '<svg class="badge" viewBox="0 0 24 24" fill="#2ba640" xmlns="http://www.w3.org/2000/svg"><path d="M12 21S3 14.7 3 8.9C3 5.9 5.4 4 7.9 4c1.6 0 3.1.8 4.1 2.1C13 4.8 14.5 4 16.1 4 18.6 4 21 5.9 21 8.9 21 14.7 12 21 12 21z"/></svg>',
};

// Приглушённо-пастельная палитра: 20 оттенков по цветовому кругу (шаг 18°),
// чуть темнее классической пастели, чтобы лучше читалось. Ник каждого автора
// детерминированно получает свой цвет.
// ?origcolors=1 — уважать «родные» цвета ников (например, выбранные на Twitch).
const PALETTE = [];
for (let hue = 0; hue < 360; hue += 18) {
  PALETTE.push(`hsl(${hue} ${hue % 36 === 0 ? 50 : 58}% ${hue % 36 === 0 ? 70 : 65}%)`);
}
function autoColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
const ORIG_COLORS = q.get('origcolors') === '1';
function nameColor(a) {
  return (ORIG_COLORS && a.color) ? a.color : autoColor(a.name || '?');
}

function okUrl(u) { return typeof u === 'string' && /^https:\/\//.test(u); }

function hexToRgba(hex, a) {
  const m = /^#([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return 'rgba(255,179,0,' + a + ')';
  const n = parseInt(m[1], 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

function svgSpan(html) { const s = el('span'); s.innerHTML = html; return s.firstChild; }

function fmtTime(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

// --- построение DOM сообщения (без вставки на страницу) ---
function buildMsg(m) {
  const div = el('div', 'msg ' + (m.kind || 'chat') + (m.action ? ' action' : ''));

  if (m.kind === 'system') {
    if (SHOW_PLATFORM && P_ICONS[m.platform]) div.appendChild(svgSpan(P_ICONS[m.platform]));
    const t = el('span', 'text');
    t.textContent = m.system || '';
    div.appendChild(t);
    return div;
  }

  if (SHOW_TS) { const t = el('span', 'time'); t.textContent = fmtTime(m.ts || Date.now()); div.appendChild(t); }
  if (SHOW_PLATFORM && P_ICONS[m.platform]) div.appendChild(svgSpan(P_ICONS[m.platform]));
  const a = m.author || { name: '?', roles: [] };
  if (okUrl(a.avatar)) { const img = el('img', 'avatar'); img.src = a.avatar; img.onerror = () => img.remove(); div.appendChild(img); }
  if (SHOW_BADGES) {
    for (const role of a.roles || []) {
      if (role === 'member' && okUrl(a.badgeUrl)) {
        const img = el('img', 'badge'); img.src = a.badgeUrl; img.onerror = () => img.remove(); div.appendChild(img);
      } else if (R_ICONS[role]) {
        div.appendChild(svgSpan(R_ICONS[role]));
      }
    }
  }
  const name = el('span', 'name');
  name.textContent = a.name || '?';
  name.style.color = nameColor(a);
  div.appendChild(name);

  if (m.amount) { const am = el('span', 'amount'); am.textContent = m.amount; div.appendChild(am); }
  if (m.system) { const s = el('span', 'text sys'); s.textContent = ' ' + m.system + ' '; div.appendChild(s); }

  for (const p of m.parts || []) {
    if (p.t === 'text') {
      const t = el('span', 'text');
      t.textContent = p.v;
      div.appendChild(t);
    } else if (p.t === 'emote' && okUrl(p.url)) {
      const img = el('img', 'emote');
      img.src = p.url;
      img.alt = img.title = p.alt || '';
      img.onerror = () => { img.replaceWith(document.createTextNode(p.alt || '')); };
      div.appendChild(img);
    }
  }
  if (okUrl(m.sticker)) { const img = el('img', 'sticker'); img.src = m.sticker; img.onerror = () => img.remove(); div.appendChild(img); }
  if (m.kind === 'super' && m.colors) {
    if (m.colors.header) div.style.setProperty('--sc-header', m.colors.header);
    if (m.colors.body) div.style.setProperty('--sc-body-t', hexToRgba(m.colors.body, 0.3));
  }
  return div;
}

// --- анимации (Web Animations API: не зависят от гонок style-recalc,
// в отличие от CSS-transition на свежевставленных элементах) ---
// Появление: обёртка-«слот» растёт, сообщение из фейда выползает из края
// чата; туман держится на кромке первую половину и плавно уезжает за
// край. Исчезновение: обёртка схлопывается, сообщение дрейфует к краю,
// гаснет и растворяется в тумане — целиком, без обрезки «со своего низа».
const EASE = 'cubic-bezier(0.22, 0.61, 0.36, 1)';

function animateMask(wrap, entering) {
  // enter: туман на кромке (FROM) до середины, потом уезжает (TO);
  // leave: туман наползает из-за края в первой половине и остаётся.
  try {
    const half = ANIM_MS / 2;
    wrap.animate(
      { maskPosition: [MASK_FROM, MASK_TO], webkitMaskPosition: [MASK_FROM, MASK_TO] },
      entering
        ? { delay: half, duration: half, easing: 'ease', fill: 'both' }
        : { duration: half, easing: 'ease', fill: 'forwards' }
    );
  } catch (e) { /* нет маски — не смертельно */ }
}

function animateOut(wrap, instant) {
  if (wrap.dataset.out) return;
  wrap.dataset.out = '1';
  byId.delete(wrap.dataset.id);
  if (instant) { wrap.remove(); return; }
  const inner = wrap.firstElementChild;
  const h = wrap.offsetHeight;
  const gap = getComputedStyle(wrap).marginTop || GAP + 'px';
  wrap.classList.remove('enter');
  wrap.classList.add('anim', 'leave');
  wrap.animate(
    { height: [h + 'px', '0px'], marginTop: [gap, '0px'] },
    { duration: ANIM_MS, easing: EASE, fill: 'forwards' }
  );
  animateMask(wrap, false);
  if (inner) {
    inner.animate(
      { opacity: [1, 0], transform: ['none', DIR_TOP ? 'translateY(10px)' : 'translateY(-10px)'] },
      { duration: ANIM_MS, easing: 'ease', fill: 'forwards' }
    );
  }
  setTimeout(() => wrap.remove(), ANIM_MS + 60);
}

// Убрать всё, что после появления новичка не влезает ЦЕЛИКОМ по высоте
// (и страховочный лимит по количеству). Считаем по финальным высотам
// (dataset.h), а не по текущим кадрам анимации — детерминированно.
function trimAll(instant) {
  const live = [...chat.children].filter(c => !c.dataset.out);
  const newestFirst = DIR_TOP ? live : live.reverse();
  const avail = window.innerHeight - 20; // паддинги контейнера
  let used = 0;
  for (let i = 0; i < newestFirst.length; i++) {
    const c = newestFirst[i];
    used += (+c.dataset.h || c.offsetHeight) + GAP;
    if (i > 0 && (used > avail || i >= LIMIT)) animateOut(c, instant);
  }
}

function place(m, instant) {
  const wrap = el('div', 'mwrap');
  wrap.dataset.id = m.id;
  wrap.dataset.src = m.source || '';
  if (m.author && m.author.key) wrap.dataset.key = m.author.key;
  const inner = buildMsg(m);
  wrap.appendChild(inner);
  if (DIR_TOP) chat.insertBefore(wrap, chat.firstChild);
  else chat.appendChild(wrap);
  byId.set(m.id, wrap);
  const h = wrap.offsetHeight;
  wrap.dataset.h = h;
  trimAll(instant);
  if (!instant) {
    wrap.classList.add('anim', 'enter');
    const grow = wrap.animate(
      { height: ['0px', h + 'px'], marginTop: ['0px', GAP + 'px'] },
      { duration: ANIM_MS, easing: EASE }
    );
    inner.animate({ opacity: [0, 1] }, { duration: ANIM_MS, easing: 'ease' });
    animateMask(wrap, true);
    grow.onfinish = () => {
      if (!wrap.dataset.out) wrap.classList.remove('anim', 'enter');
    };
  }
  if (FADE > 0) setTimeout(() => animateOut(wrap), FADE * 1000);
}

// --- очередь показа: в память сообщения приходят пачками (особенно с
// YouTube), на экран выдаются строго по одному. Темп подстраивается под
// длину очереди, чтобы не отставать от живого чата. ---
const queue = [];
let pumping = false;

// Темп нарочно спокойный: сообщения не должны суетливо сдвигать друг друга,
// даже когда пришла пачка. При переполнении очереди лишнее просто отпадёт.
function pace() {
  if (queue.length > 30) return 180;
  if (queue.length > 12) return 300;
  return 450;
}

function pump() {
  if (pumping) return;
  pumping = true;
  (function step() {
    const m = queue.shift();
    if (!m) { pumping = false; return; }
    place(m, false);
    setTimeout(step, pace());
  })();
}

function enqueue(m) {
  if (!m || !m.id || byId.has(m.id) || queue.some(x => x.id === m.id)) return;
  queue.push(m);
  if (queue.length > 80) queue.splice(0, queue.length - 80);
  pump();
}

// --- удаления (модерация) ---
function removeById(id) {
  const n = byId.get(id);
  if (n) animateOut(n);
  const qi = queue.findIndex(x => x.id === id);
  if (qi !== -1) queue.splice(qi, 1);
}

function removeAuthor(source, key) {
  for (const n of [...chat.children]) {
    if (n.dataset.src === source && n.dataset.key === key) animateOut(n);
  }
  for (let i = queue.length - 1; i >= 0; i--) {
    const m = queue[i];
    if (m.source === source && m.author && m.author.key === key) queue.splice(i, 1);
  }
}

function clearSource(source, instant) {
  for (const n of [...chat.children]) {
    if (!source || n.dataset.src === source) animateOut(n, instant);
  }
  for (let i = queue.length - 1; i >= 0; i--) {
    if (!source || queue[i].source === source) queue.splice(i, 1);
  }
}

window.addEventListener('resize', () => trimAll());

const es = new EventSource('/events');
es.onmessage = e => {
  let d;
  try { d = JSON.parse(e.data); } catch (err) { return; }
  switch (d.type) {
    case 'hello':
      clearSource(null, true);
      for (const m of d.history || []) {
        if (!byId.has(m.id)) place(m, true);
      }
      break;
    case 'msg': enqueue(d); break;
    case 'remove': removeById(d.id); break;
    case 'removeAuthor': removeAuthor(d.source, d.key); break;
    case 'clear': clearSource(d.source || null); break;
  }
};
</script>
</body>
</html>
